<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TASCO Password Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #16213e;
    border-radius: 16px;
    padding: 28px 22px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    text-align: center;
  }
  h1 {
    font-size: 1.2rem;
    color: #a0c4ff;
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .subtitle {
    font-size: 0.65rem;
    color: #666;
    margin-bottom: 22px;
  }
  .row {
    background: #0f3460;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 12px;
  }
  .row .lbl {
    font-size: 0.6rem;
    color: #888;
    margin-bottom: 4px;
  }
  .row .val {
    font-size: 1.3rem;
    font-family: monospace;
    letter-spacing: 3px;
    color: #e0e0e0;
  }
  .pw-box {
    background: linear-gradient(135deg, #1a1a4e, #2a2a8e);
    border: 2px solid #ffffff;
    border-radius: 12px;
    padding: 22px 16px;
    margin-top: 4px;
    box-shadow: 0 0 18px rgba(255,255,255,0.15);
  }
  .pw-box .lbl {
    font-size: 0.65rem;
    color: #a0c4ff;
    margin-bottom: 10px;
  }
  .pw-box .pw {
    font-size: 2rem;
    font-family: monospace;
    letter-spacing: 5px;
    color: #fff;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="card">
  <h1>🖨️ TASCO Password Calculator</h1>
  <p class="subtitle">서울 시간 기준 일일 패스워드 자동 계산</p>

  <div class="row">
    <div class="lbl">오늘 날짜 (YYYY/MM/DD)</div>
    <div class="val" id="dateStr">-</div>
  </div>

  <div class="pw-box">
    <div class="lbl">오늘의 패스워드</div>
    <div class="pw" id="password">-</div>
  </div>
</div>

<script>
  const MAP = {0:1,1:2,2:3,3:4,4:1,5:2,6:3,7:4,8:1,9:2};

  function pad(n) { return String(n).padStart(2,'0'); }

  function calcPassword(ddmmyyyy) {
    return ddmmyyyy.split('').map(c => MAP[parseInt(c)]).join('');
  }

  function getSeoulToday() {
    const now = new Date();
    const seoul = new Date(now.toLocaleString('en-US', {timeZone: 'Asia/Seoul'}));
    return {
      y: seoul.getFullYear(),
      m: pad(seoul.getMonth()+1),
      d: pad(seoul.getDate())
    };
  }

  const s = getSeoulToday();
  const raw = s.d + s.m + s.y; // 패스워드 계산용: DDMMYYYY
  const display = s.y + '/' + s.m + '/' + s.d; // 화면 표시용: YYYY/MM/DD

  document.getElementById('dateStr').textContent = display;
  document.getElementById('password').textContent = calcPassword(raw);
</script>
</body>
</html>
