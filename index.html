<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TASCO Password Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #16213e;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    text-align: center;
  }
  h1 { font-size: 1.4rem; color: #a0c4ff; margin-bottom: 6px; }
  .subtitle { font-size: 0.85rem; color: #666; margin-bottom: 32px; }
  .row {
    background: #0f3460;
    border-radius: 10px;
    padding: 14px 20px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .row .lbl { font-size: 0.8rem; color: #888; }
  .row .val { font-size: 1.2rem; font-family: monospace; letter-spacing: 3px; color: #e0e0e0; }
  .pw-box {
    background: linear-gradient(135deg, #0f3460, #1a1a6e);
    border: 2px solid #a0c4ff;
    border-radius: 14px;
    padding: 24px;
    margin-top: 20px;
  }
  .pw-box .lbl { font-size: 0.8rem; color: #a0c4ff; margin-bottom: 10px; }
  .pw-box .pw { font-size: 2.2rem; font-family: monospace; letter-spacing: 6px; color: #fff; font-weight: bold; }
  .map-table { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 24px; }
  .map-cell { background: #0f3460; border-radius: 6px; padding: 6px 10px; font-size: 0.75rem; font-family: monospace; color: #888; }
  .map-cell span { color: #a0c4ff; }
</style>
</head>
<body>
<div class="card">
  <h1>🖨️ TASCO Password Calculator</h1>
  <p class="subtitle">날짜 기반 일일 패스워드 자동 계산 (서울 시간 기준)</p>

  <div class="row">
    <span class="lbl">오늘 날짜 (DD/MM/YYYY)</span>
    <span class="val" id="dateStr">-</span>
  </div>

  <div class="pw-box">
    <div class="lbl">오늘의 패스워드</div>
    <div class="pw" id="password">-</div>
  </div>

  <div class="map-table" id="mapTable"></div>
</div>

<script>
  const MAP = {0:1,1:2,2:3,3:4,4:1,5:2,6:3,7:4,8:1,9:2};

  function pad(n) { return String(n).padStart(2,'0'); }

  function calcPassword(dateStr) {
    return dateStr.split('').map(c => MAP[parseInt(c)]).join('');
  }

  function getSeoulToday() {
    const now = new Date();
    const seoul = new Date(now.toLocaleString('en-US', {timeZone: 'Asia/Seoul'}));
    return {
      y: seoul.getFullYear(),
      m: pad(seoul.getMonth()+1),
      d: pad(seoul.getDate())
    };
  }

  const s = getSeoulToday();
  const raw = s.d + s.m + s.y;
  document.getElementById('dateStr').textContent = raw;
  document.getElementById('password').textContent = calcPassword(raw);

  // 매핑 테이블
  const mt = document.getElementById('mapTable');
  Object.entries(MAP).forEach(([k,v]) => {
    const el = document.createElement('div');
    el.className = 'map-cell';
    el.innerHTML = `${k} → <span>${v}</span>`;
    mt.appendChild(el);
  });
</script>
</body>
</html>
