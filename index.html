<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markem Password Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #16213e;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    text-align: center;
  }
  h1 { font-size: 1.4rem; color: #a0c4ff; margin-bottom: 6px; }
  .subtitle { font-size: 0.85rem; color: #666; margin-bottom: 32px; }
  .date-input-wrap { margin-bottom: 24px; }
  .date-input-wrap label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 8px; }
  input[type="date"] {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid #2a2a5a;
    background: #0f3460;
    color: #fff;
    font-size: 1rem;
    text-align: center;
    outline: none;
  }
  input[type="date"]:focus { border-color: #a0c4ff; }
  .row {
    background: #0f3460;
    border-radius: 10px;
    padding: 14px 20px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .row .lbl { font-size: 0.8rem; color: #888; }
  .row .val { font-size: 1.2rem; font-family: monospace; letter-spacing: 3px; color: #e0e0e0; }
  .pw-box {
    background: linear-gradient(135deg, #0f3460, #1a1a6e);
    border: 2px solid #a0c4ff;
    border-radius: 14px;
    padding: 24px;
    margin-top: 20px;
  }
  .pw-box .lbl { font-size: 0.8rem; color: #a0c4ff; margin-bottom: 10px; }
  .pw-box .pw { font-size: 2.2rem; font-family: monospace; letter-spacing: 6px; color: #fff; font-weight: bold; }
  .copy-btn {
    margin-top: 16px;
    padding: 10px 28px;
    background: #a0c4ff;
    color: #1a1a2e;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }
  .copy-btn:hover { background: #c0d8ff; }
  .copy-msg { font-size: 0.75rem; color: #a0c4ff; margin-top: 8px; height: 16px; }
  .map-table { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 24px; }
  .map-cell { background: #0f3460; border-radius: 6px; padding: 6px 10px; font-size: 0.75rem; font-family: monospace; color: #888; }
  .map-cell span { color: #a0c4ff; }
</style>
</head>
<body>
<div class="card">
  <h1>🖨️ Markem Password Calculator</h1>
  <p class="subtitle">날짜 기반 일일 패스워드 자동 계산 (서울 시간 기준)</p>

  <div class="date-input-wrap">
    <label>날짜 선택 (기본: 오늘 서울 시간)</label>
    <input type="date" id="dateInput">
  </div>

  <div class="row">
    <span class="lbl">입력 날짜 (DD/MM/YYYY)</span>
    <span class="val" id="dateStr">-</span>
  </div>

  <div class="pw-box">
    <div class="lbl">오늘의 패스워드</div>
    <div class="pw" id="password">-</div>
  </div>

  <button class="copy-btn" onclick="copyPw()">복사하기</button>
  <div class="copy-msg" id="copyMsg"></div>

  <div class="map-table" id="mapTable"></div>
</div>

<script>
  const MAP = {0:1,1:2,2:3,3:4,4:1,5:2,6:3,7:4,8:1,9:2};

  function pad(n) { return String(n).padStart(2,'0'); }

  function calcPassword(dateStr) {
    return dateStr.split('').map(c => MAP[parseInt(c)]).join('');
  }

  function update() {
    const input = document.getElementById('dateInput').value;
    if (!input) return;
    const d = new Date(input);
    const dd = pad(d.getDate());
    const mm = pad(d.getMonth()+1);
    const yyyy = d.getFullYear();
    const raw = dd + mm + yyyy;
    const pw = calcPassword(raw);
    document.getElementById('dateStr').textContent = raw;
    document.getElementById('password').textContent = pw;
  }

  function copyPw() {
    const pw = document.getElementById('password').textContent;
    if (pw === '-') return;
    navigator.clipboard.writeText(pw).then(() => {
      const msg = document.getElementById('copyMsg');
      msg.textContent = '✅ 복사되었습니다!';
      setTimeout(() => msg.textContent = '', 2000);
    });
  }

  // 매핑 테이블 표시
  const mt = document.getElementById('mapTable');
  Object.entries(MAP).forEach(([k,v]) => {
    const el = document.createElement('div');
    el.className = 'map-cell';
    el.innerHTML = `${k} → <span>${v}</span>`;
    mt.appendChild(el);
  });

  // 서울 시간 기준 오늘 날짜
  function getSeoulToday() {
    const now = new Date();
    const seoul = new Date(now.toLocaleString('en-US', {timeZone: 'Asia/Seoul'}));
    return {
      y: seoul.getFullYear(),
      m: pad(seoul.getMonth()+1),
      d: pad(seoul.getDate())
    };
  }

  const s = getSeoulToday();
  const todayStr = s.y+'-'+s.m+'-'+s.d;
  document.getElementById('dateInput').value = todayStr;
  update();

  document.getElementById('dateInput').addEventListener('change', update);
</script>
</body>
</html>
